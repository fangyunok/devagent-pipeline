[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devagent-pipeline"
version = "0.1.0"
description = "Multi-agent requirement-to-review pipeline with dual-layer eval harness and domain knowledge loop"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
